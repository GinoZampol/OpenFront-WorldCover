name: Deploy single-player game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Select the correct site base path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            echo "STATIC_BASE=/" >> "$GITHUB_ENV"
          else
            echo "STATIC_BASE=/$repository_name/" >> "$GITHUB_ENV"
          fi

      - name: Build static single-player site
        run: npm run build-static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
